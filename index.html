 for(let i=0;i<10;i++){g.fillStyle=i%2?'#2e8b3e':'#35a047';g.fillRect(0,i*80,500,80)}

 const w=W-GW;for(const t of[-1,1]){box(w,CH,1,t*(GW+w/2),CH/2,s*(L+.5))}

 box(2*GW+.6,.5,.5,0,GH,s*L,new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.5}));}
{const n=900,im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1.6,1),new THREE.MeshLambertMaterial(),n),m=new THREE.Matrix4(),c=new THREE.Color();
 for(let i=0;i<n;i++){const r=Math.random()*5|0,hx=W+4+r*2.2,hz=L+10+r*2.2,u=Math.random()*(4*hx+4*hz)-(2*hx+2*hz);let x,z;
  if(Math.abs(u)<hx){x=u;z=Math.random()<.5?-hz:hz}else{z=(Math.random()*2-1)*hz;x=Math.random()<.5?-hx:hx}
  m.setPosition(x,2+r*1.8,z);im.setMatrixAt(i,m);im.setColorAt(i,c.setHSL(Math.random(),.6,.5))}

box(2*W+40,.2,2*L+60,0,-.2,0,new THREE.MeshLambertMaterial({color:0x10182c}));

// Pelota
const ballTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');g.fillStyle='#f4f6fa';g.fillRect(0,0,256,128);g.fillStyle='#22304a';
 for(let i=0;i<14;i++){g.beginPath();const x=Math.random()*256,y=Math.random()*128;for(let k=0;k<6;k++)g.lineTo(x+Math.cos(k*1.047)*12,y+Math.sin(k*1.047)*12);g.fill()}

function mkCar(color,style,name,team){
 const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color,metalness:.5,roughness:.3}),dk=new THREE.MeshStandardMaterial({color:0x10161f,roughness:.4,metalness:.6});

 for(const x of[-.7,.7]){const h=new THREE.Mesh(new THREE.BoxGeometry(.4,.2,.1),hl);h.position.set(x,.1,D[2]/2);g.add(h)}

 const sprt=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cn),depthTest:false,transparent:true}));sprt.scale.set(5,1.25,1);sprt.position.y=2.4;sprt.renderOrder=9;g.add(sprt);

// Partículas
const NP=400,pp=new Float32Array(NP*3),pc=new Float32Array(NP*3),pv=new Float32Array(NP*3),pa=new Float32Array(NP);let pi=0;

const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));let last=performance.now(),cp=new THREE.Vector3(0,8,-20),lastBoostFx=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.1);last=now;
 if(!inGame){const t=now/1000;if(menuCar){menuCar.rotation.y=t*.4;cam.position.set(Math.sin(t*.2)*9,3.5,Math.cos(t*.2)*9);cam.lookAt(0,.8,0);menuCar.visible=true}
  ball.position.set(14,2,-4);cam.position.y=3.5;ren.render(scene,cam);return}
 const lag=Math.min((now-snapT)/1000,.12),k=1-Math.exp(-28*dt);
 ball.position.set(bs.x+bs.vx*lag,bs.y+bs.vy*lag,bs.z+bs.vz*lag);
 const sp=Math.hypot(bs.vx,bs.vz);if(sp>.1){ball.rotateOnWorldAxis(new THREE.Vector3(-bs.vz,0,bs.vx).normalize(),sp/2*dt)}
 for(const[id,v]of view){const a=v.t;if(!a)continue;
  v.pos.lerp(new THREE.Vector3(a[1]+a[4]*lag,a[2]+a[5]*lag,a[3]+a[6]*lag),k);
  v.yaw+=wrapA(a[7]-v.yaw)*k;v.pi=a[8];v.ro=a[9];
  v.g.position.copy(v.pos);v.g.inner.rotation.set(v.pi,v.yaw,v.ro,'YXZ');
  if(a[11]&&now-lastBoostFx>0){const fx=Math.sin(v.yaw),fz=Math.cos(v.yaw);burst(v.pos.x-fx*1.9,v.pos.y,v.pos.z-fz*1.9,Math.random()<.5?'#ff9a1f':'#ffe27a',2,3)}}
 lastBoostFx=now;partStep(dt);
 const v=view.get(me);
 if(v){const fx=Math.sin(v.yaw),fz=Math.cos(v.yaw);let dx=-fx,dz=-fz,tx,ty,tz;
  const bp=ball.position,cpp=v.pos;
  if(S.bc){let ax=cpp.x-bp.x,az=cpp.z-bp.z;const l=Math.hypot(ax,az);if(l>4){dx=ax/l;dz=az/l}}
  const target=new THREE.Vector3(cpp.x+dx*10.5,Math.max(cpp.y+4.6,4.2),cpp.z+dz*10.5);
  cp.lerp(target,1-Math.exp(-7*dt));cam.position.copy(cp);
  if(S.bc){tx=cpp.x*.4+bp.x*.6;ty=cpp.y*.4+bp.y*.6;tz=cpp.z*.4+bp.z*.6}else{tx=cpp.x+fx*8;ty=cpp.y+1;tz=cpp.z+fz*8}
  cam.lookAt(tx,ty,tz)}
 if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*1.2)}
 const sc=sun.position;sun.target.position.set(0,0,0);sun.target.updateMatrixWorld();
 ren.render(scene,cam)}
